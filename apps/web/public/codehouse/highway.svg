<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Codehouse: the empty highway at dusk, a light far off. Original artwork, drawn for the app (royalty-free). -->
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1442"/>
      <stop offset="0.45" stop-color="#6b2a5e"/>
      <stop offset="0.75" stop-color="#e0703c"/>
      <stop offset="1" stop-color="#f5b25a"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="1" stop-color="#120c12"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect width="1600" height="600" fill="url(#dusk)"/>
  <circle cx="1080" cy="560" r="70" fill="#ffd27a" opacity="0.85"/>
  <path d="M0,600 L180,560 L360,585 L560,540 L760,575 L980,548 L1200,580 L1400,552 L1600,578 L1600,600 Z" fill="#2c1a2a"/>
  <rect y="600" width="1600" height="400" fill="url(#land)"/>
  <!-- the road to the vanishing point -->
  <polygon points="780,600 820,600 1320,1000 280,1000" fill="#1d1a20"/>
  <g fill="#f0d27a">
    <polygon points="798,620 802,620 804,650 796,650"/>
    <polygon points="796,690 804,690 807,740 793,740"/>
    <polygon points="793,800 807,800 812,880 788,880"/>
    <polygon points="788,940 812,940 815,1000 785,1000"/>
  </g>
  <!-- poles and the wire -->
  <g stroke="#140c14" stroke-width="6">
    <line x1="1000" y1="520" x2="1000" y2="640"/><line x1="985" y1="535" x2="1015" y2="535"/>
    <line x1="1180" y1="430" x2="1180" y2="700"/><line x1="1150" y1="455" x2="1210" y2="455"/>
    <line x1="1450" y1="300" x2="1450" y2="800"/><line x1="1400" y1="340" x2="1500" y2="340"/>
  </g>
  <path d="M1000,537 Q1090,560 1180,457 Q1310,470 1450,342" fill="none" stroke="#140c14" stroke-width="2"/>
  <!-- the roadhouse light far off -->
  <circle cx="610" cy="590" r="10" fill="#ff4fa0" filter="url(#glow)"/>
  <circle cx="610" cy="590" r="3" fill="#ffd0e8"/>
  <rect x="585" y="590" width="50" height="10" fill="#2c1a2a"/>
</svg>
