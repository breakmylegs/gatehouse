<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Codehouse: the roadhouse at night under its sign. Original artwork, drawn for the app (royalty-free). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b1e"/>
      <stop offset="0.6" stop-color="#1c1240"/>
      <stop offset="1" stop-color="#3a1840"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1418"/>
      <stop offset="1" stop-color="#0b0a0c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4fa0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4fa0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="140" cy="90" r="1.6"/><circle cx="320" cy="160" r="1.2"/><circle cx="520" cy="70" r="1.8"/>
    <circle cx="760" cy="130" r="1.1"/><circle cx="980" cy="60" r="1.5"/><circle cx="1210" cy="120" r="1.3"/>
    <circle cx="1420" cy="80" r="1.7"/><circle cx="1500" cy="210" r="1.1"/><circle cx="90" cy="260" r="1.2"/>
    <circle cx="660" cy="240" r="1"/><circle cx="1120" cy="250" r="1.2"/>
  </g>
  <circle cx="1330" cy="170" r="46" fill="#f4ecd2" opacity="0.9"/>
  <circle cx="1350" cy="160" r="46" fill="#1c1240"/>
  <rect y="720" width="1600" height="280" fill="url(#ground)"/>
  <!-- the building -->
  <polygon points="380,560 880,560 960,640 300,640" fill="#2a1b24"/>
  <rect x="320" y="640" width="620" height="140" fill="#3b2630"/>
  <rect x="320" y="770" width="620" height="10" fill="#22161c"/>
  <g fill="#ffb347" opacity="0.85">
    <rect x="370" y="680" width="70" height="50" rx="3"/>
    <rect x="470" y="680" width="70" height="50" rx="3"/>
    <rect x="720" y="680" width="70" height="50" rx="3"/>
    <rect x="820" y="680" width="70" height="50" rx="3"/>
  </g>
  <rect x="590" y="670" width="90" height="110" fill="#ffcf80" opacity="0.9"/>
  <rect x="633" y="670" width="4" height="110" fill="#3b2630"/>
  <!-- the pole sign -->
  <rect x="1130" y="420" width="18" height="380" fill="#2a2430"/>
  <rect x="1000" y="300" width="300" height="150" rx="14" fill="#140f1c" stroke="#3a2f48" stroke-width="4"/>
  <g filter="url(#glow)" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="1150" y="372" font-size="54" fill="none" stroke="#ff4fa0" stroke-width="3" letter-spacing="3">CODEHOUSE</text>
    <text x="1150" y="425" font-size="34" fill="none" stroke="#4ff0e0" stroke-width="2.5" letter-spacing="8">OPEN</text>
  </g>
  <ellipse cx="1150" cy="830" rx="260" ry="40" fill="url(#pool)"/>
  <!-- gravel and a fence -->
  <g stroke="#2e2630" stroke-width="6">
    <line x1="0" y1="760" x2="250" y2="760"/><line x1="40" y1="730" x2="40" y2="790"/>
    <line x1="120" y1="730" x2="120" y2="790"/><line x1="200" y1="730" x2="200" y2="790"/>
  </g>
</svg>
