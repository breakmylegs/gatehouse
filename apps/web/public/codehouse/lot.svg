<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Codehouse: the parking lot under the moon, a pickup and an arrow sign. Original artwork (royalty-free). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a18"/>
      <stop offset="1" stop-color="#1a1a3a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="300" cy="180" r="70" fill="#efe6c8" opacity="0.92"/>
  <circle cx="270" cy="160" r="12" fill="#d8ceb0" opacity="0.7"/><circle cx="320" cy="205" r="8" fill="#d8ceb0" opacity="0.7"/>
  <path d="M0,640 Q200,610 420,630 T860,620 T1300,635 T1600,625 L1600,700 L0,700 Z" fill="#141226"/>
  <rect y="700" width="1600" height="300" fill="#121014"/>
  <g stroke="#2a2630" stroke-width="5" stroke-dasharray="40 30">
    <line x1="200" y1="900" x2="1400" y2="900"/>
  </g>
  <!-- the pickup, a plain silhouette -->
  <g fill="#0a080c">
    <path d="M420,820 L440,760 L560,760 L600,720 L740,720 L780,770 L880,775 L900,820 Z"/>
    <circle cx="500" cy="830" r="38"/><circle cx="820" cy="830" r="38"/>
  </g>
  <g fill="#3a3448"><circle cx="500" cy="830" r="14"/><circle cx="820" cy="830" r="14"/></g>
  <rect x="610" y="730" width="110" height="34" rx="4" fill="#2a2a40" opacity="0.7"/>
  <!-- the arrow sign -->
  <rect x="1230" y="430" width="16" height="380" fill="#24202c"/>
  <g filter="url(#glow)" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <path d="M1060,360 L1360,360 L1420,420 L1360,480 L1060,480 Z" fill="#120f1a" stroke="#ffb347" stroke-width="4"/>
    <text x="1220" y="438" font-size="44" fill="none" stroke="#ff4fa0" stroke-width="2.5" letter-spacing="5">EAT · DRINK</text>
  </g>
  <g fill="#ffb347" opacity="0.9">
    <circle cx="1080" cy="345" r="4"/><circle cx="1130" cy="345" r="4"/><circle cx="1180" cy="345" r="4"/>
    <circle cx="1230" cy="345" r="4"/><circle cx="1280" cy="345" r="4"/><circle cx="1330" cy="345" r="4"/>
  </g>
</svg>
