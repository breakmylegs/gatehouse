<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Codehouse: inside the bar, neon on the wall and a lamp over the table. Original artwork (royalty-free). -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160f14"/>
      <stop offset="1" stop-color="#2a1a1c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3420"/>
      <stop offset="1" stop-color="#2a170e"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <!-- the back shelves with plain bottles -->
  <rect x="80" y="260" width="620" height="12" fill="#3a2418"/>
  <rect x="80" y="400" width="620" height="12" fill="#3a2418"/>
  <g opacity="0.85">
    <rect x="110" y="190" width="26" height="70" rx="6" fill="#3c6b4a"/><rect x="150" y="205" width="22" height="55" rx="5" fill="#8a5a2a"/>
    <rect x="190" y="185" width="28" height="75" rx="6" fill="#5a3a6a"/><rect x="240" y="200" width="24" height="60" rx="5" fill="#2f4f6b"/>
    <rect x="290" y="190" width="26" height="70" rx="6" fill="#8a2f3a"/><rect x="340" y="210" width="20" height="50" rx="5" fill="#b08a3a"/>
    <rect x="130" y="335" width="26" height="65" rx="6" fill="#2f4f6b"/><rect x="180" y="345" width="24" height="55" rx="5" fill="#3c6b4a"/>
    <rect x="230" y="330" width="28" height="70" rx="6" fill="#8a5a2a"/><rect x="280" y="350" width="22" height="50" rx="5" fill="#5a3a6a"/>
  </g>
  <!-- neon on the wall -->
  <g filter="url(#glow)" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-weight="700">
    <text x="900" y="250" font-size="72" fill="none" stroke="#4ff0e0" stroke-width="3" letter-spacing="6">LIVE</text>
    <text x="900" y="340" font-size="72" fill="none" stroke="#ff4fa0" stroke-width="3" letter-spacing="6">MUSIC</text>
    <path d="M1260,200 l40,60 l-40,60 l40,60" fill="none" stroke="#ffb347" stroke-width="4"/>
  </g>
  <!-- the lamp and the table -->
  <line x1="1150" y1="0" x2="1150" y2="470" stroke="#0e0a0c" stroke-width="4"/>
  <polygon points="1060,470 1240,470 1200,430 1100,430" fill="#2d5a3a"/>
  <polygon points="980,480 1320,480 1500,900 800,900" fill="url(#lamp)"/>
  <polygon points="900,760 1400,760 1440,820 860,820" fill="#1f5a3a"/>
  <rect x="860" y="820" width="580" height="20" fill="#3a2418"/>
  <!-- the bar counter -->
  <rect x="0" y="640" width="760" height="40" fill="#7a4a2a"/>
  <rect x="0" y="680" width="740" height="320" fill="url(#wood)"/>
  <g fill="#1a0f0a"><rect x="120" y="760" width="16" height="240"/><rect x="380" y="760" width="16" height="240"/><rect x="640" y="760" width="16" height="240"/></g>
</svg>
