<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Jean-Claude Van Code</title>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #0b0b0c center / cover no-repeat url("./jcvc/loading-trucks.png");
        color: #fff;
        font:
          600 22px "Segoe UI",
          system-ui,
          sans-serif;
        transition: opacity 0.4s;
      }
      #boot[data-leaving] {
        opacity: 0;
        pointer-events: none;
      }
      #boot span {
        align-self: end;
        margin-bottom: 8vh;
        padding: 6px 16px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 6px;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status"><span>Jean-Claude Van Code</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
