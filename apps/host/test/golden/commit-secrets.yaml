# D-058, the secret commit block: lines a commit or push adds, and what the scanner finds in each. The keys are
# written as {NAME} and put together by commit-scan.test.ts at run time, so this file holds none and can be committed.
# found: the kinds expected, in order; [] means the line must pass (ordinary code and words are never stopped).
- { line: 'const key = "{AWS}"', found: [an AWS access key], note: "an AWS access key in code" }
- { line: "aws_access_key_id = {AWS}", found: [an AWS access key], note: "in an ini file" }
- { line: "{PEM}", found: [a private key], note: "a private key's first line" }
- { line: "ANTHROPIC_API_KEY={ANT}", found: [an Anthropic API key], note: "an Anthropic key in an env file" }
- { line: "OPENAI_API_KEY={OPENAI}", found: [an OpenAI API key], note: "an OpenAI project key" }
- { line: "token: {GH}", found: [a GitHub token], note: "a GitHub token in YAML" }
- { line: "SLACK={SLACK}", found: [a Slack token], note: "a Slack bot token" }
- { line: 'maps: "{GOOGLE}"', found: [a Google API key], note: "a Google API key" }
- { line: 'url = "{URLPW}"', found: [a password in a web address], note: "a password in a database address" }
- { line: 'const AKIA = "not a key"', found: [], note: "the prefix alone" }
- { line: "password = hunter2 in a sentence", found: [], note: "the word password" }
- { line: "-----BEGIN PUBLIC KEY-----", found: [], note: "a public key is not secret" }
- { line: "see https://user@example.org/path", found: [], note: "a user name in an address, no password" }
- { line: 'const ghp = "ghp_short"', found: [], note: "a token prefix that is too short" }
- { line: "sk-ant-placeholder", found: [], note: "a placeholder too short to be a key" }
