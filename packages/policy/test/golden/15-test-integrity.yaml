- { t: Edit, in: { file_path: "${WS}/tests/Build.Tests.ps1", old_string: "It \"builds\" -Skip {", new_string: "It \"builds\" {" }, o: allow, r: edit-workspace-source, note: "-Skip taken off" }
- { t: Edit, in: { file_path: "${WS}/tests/Build.Tests.ps1", old_string: "$result | Should -Be 3", new_string: "$result | Should -Be 3\n    $log | Should -Not -BeNullOrEmpty" }, o: allow, r: edit-workspace-source, note: "a Should added" }
