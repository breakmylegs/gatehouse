# D-060, the agent-config tamper floor: a session never changes what an AI tool may do without asking, in any mode:
# permissions and hooks in .claude/settings*.json, autoApprove and chat.tools in .vscode/settings.json, Cursor's and
# Codex's configuration, and Codehouse's own data and managed folders. Other settings, and reading, are as before.
- { t: Edit, in: { file_path: "${WS}/.vscode/settings.json", old_string: "{\n  \"editor.tabSize\": 2\n}", new_string: "{\n  \"editor.tabSize\": 2,\n  \"chat.tools.autoApprove\": true\n}" }, o: deny, r: agent-config-tamper, note: "VS Code's auto approve" }
- { t: Edit, in: { file_path: "${WS}/.claude/settings.local.json", old_string: "\"permissions\": {\n    \"allow\": []", new_string: "\"permissions\": {\n    \"allow\": [\"Bash(*)\"]" }, o: deny, r: agent-config-tamper, note: "an allow rule in Claude's local settings" }
- { t: Write, in: { file_path: "${WS}/fx/c3/.claude/settings.json", content: "{\"permissions\":{\"defaultMode\":\"bypassPermissions\"}}" }, files: [{ path: "${WS}/fx/c3/.claude/settings.json", content: "{\"permissions\":{\"allow\":[]}}" }], o: deny, r: agent-config-tamper, note: "a Write that changes permissions" }
- { t: Write, in: { file_path: "${WS}/fx/c4/.claude/settings.json", content: "{\"hooks\":{\"PreToolUse\":[]},\"env\":{\"A\":\"1\"}}" }, files: [{ path: "${WS}/fx/c4/.claude/settings.json", content: "{\"env\":{\"A\":\"1\"}}" }], o: deny, r: agent-config-tamper, note: "a Write that adds hooks" }
- { t: Bash, cmd: "echo {} > .cursor/mcp.json", o: deny, r: agent-config-tamper, note: "Cursor's configuration, from the shell" }
- { t: Edit, in: { file_path: "C:/Users/someone/.codex/config.toml", old_string: "approval_policy = \"on-request\"", new_string: "approval_policy = \"never\"" }, o: deny, r: agent-config-tamper, note: "Codex's configuration" }
- { t: Edit, in: { file_path: "C:/Users/someone/AppData/Local/Gatehouse/policy/rules.local.yaml", old_string: "remember: []", new_string: "remember: [{ id: x, tool: Bash, command: \"rm -rf /\" }]" }, o: deny, r: agent-config-tamper, note: "Codehouse's own rules" }
- { t: PowerShell, cmd: "Set-Content C:\\ProgramData\\Codehouse\\managed\\policy.yaml 'x'", o: deny, r: agent-config-tamper, note: "the managed folder" }
- { t: Bash, cmd: "cp evil.json .claude/settings.local.json", o: deny, r: agent-config-tamper, note: "copied over Claude's settings" }
- { t: Read, p: "${WS}/.claude/settings.json", o: allow, r: read-workspace, note: "reading them is fine" }
