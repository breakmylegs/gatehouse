# Remember rules (rules.local.yaml): an exact command or an exact path. They sit after the floor and deny rules,
# cannot override built-in escalations, and are rejected when malformed.
- { kind: remember, remember: { version: 1, remember: [{ id: a, tool: Bash, command: "x", path: "C:/x" }] }, load: reject, err: "exactly one of command or path" }
- { kind: remember, remember: { version: 1, remember: [{ id: a, tool: Edit, command: "x" }] }, load: reject, err: "needs tool Bash or PowerShell" }
- { kind: remember, remember: { version: 1, remember: [{ id: a, tool: Edit, path: "lib/util.js" }] }, load: reject, err: "absolute path" }
- { kind: remember, remember: { version: 1, remember: [{ id: a, tool: WebFetch, path: "C:/x" }] }, load: reject, err: "needs a file tool" }
- { kind: remember, remember: { version: 1, remember: [{ id: a, tool: Bash, command: "x" }, { id: a, tool: Bash, command: "y" }] }, load: reject, err: "duplicate id" }
- { kind: remember, remember: { version: 1, remember: [{ id: a, tool: Bash }] }, load: reject, err: "exactly one of command or path" }
- { kind: remember, remember: { version: 1, remember: [{ id: a, tool: Bash, command: "x", glob: "y" }] }, load: reject, err: "additional properties" }
- { kind: remember, remember: { version: 1, remember: [{ id: a, tool: Grep, path: "C:/x" }] }, load: reject, err: "needs a file tool" }
- { kind: remember, t: Bash, cmd: "npm install lodash", remember: { version: 1, remember: [{ id: npm1, tool: Bash, command: "npm install lodash" }] }, o: allow, r: remember-npm1 }
- { kind: remember, t: Bash, cmd: "npm install lodash && npm install evil", remember: { version: 1, remember: [{ id: npm1, tool: Bash, command: "npm install lodash" }] }, o: escalate, r: package-install }
- { kind: remember, t: Bash, cmd: "npm install lodash2", remember: { version: 1, remember: [{ id: npm1, tool: Bash, command: "npm install lodash" }] }, o: escalate, r: package-install }
- { kind: remember, t: Bash, cmd: "cat .env", remember: { version: 1, remember: [{ id: env1, tool: Bash, command: "cat .env" }] }, o: deny, r: secrets-files }
- { kind: remember, t: Bash, cmd: "git push --force", remember: { version: 1, remember: [{ id: f1, tool: Bash, command: "git push --force" }] }, o: deny, r: destructive-shell }
- { kind: remember, t: Bash, cmd: "git status $X", remember: { version: 1, remember: [{ id: d1, tool: Bash, command: "git status $X" }] }, o: escalate, r: dynamic-segment }
- { kind: remember, t: Edit, p: "lib/util.js", remember: { version: 1, remember: [{ id: p1, tool: Edit, path: "${WS}/lib/util.js" }] }, o: allow, r: remember-p1 }
- { kind: remember, t: Edit, p: "lib/other.js", remember: { version: 1, remember: [{ id: p1, tool: Edit, path: "${WS}/lib/util.js" }] }, o: escalate, r: no-rule }
- { kind: remember, t: Edit, p: "lib/util.js", remember: { version: 1, remember: [{ id: p2, tool: Read, path: "${WS}/lib/util.js" }] }, o: escalate, r: no-rule }
- { kind: remember, t: Bash, cmd: "git status && npm install lodash", remember: { version: 1, remember: [{ id: npm1, tool: Bash, command: "npm install lodash" }] }, o: allow, r: safe-shell }
- { kind: remember, t: PowerShell, cmd: "Start-Process notepad", remember: { version: 1, remember: [{ id: sp1, tool: PowerShell, command: "Start-Process notepad" }] }, o: escalate, r: pwsh-start-process }
- { kind: remember, t: Bash, cmd: "eval ls", remember: { version: 1, remember: [{ id: ev1, tool: Bash, command: "eval ls" }] }, o: escalate, r: bash-eval }
- { kind: remember, t: Bash, cmd: "echo hi > x", remember: { version: 1, remember: [{ id: w1, tool: Bash, command: "echo hi" }] }, o: escalate, r: shell-redirect-write }
- { kind: remember, t: Bash, cmd: "NPM install lodash", remember: { version: 1, remember: [{ id: npm1, tool: Bash, command: "npm install lodash" }] }, o: escalate, r: no-rule }
- { kind: remember, t: PowerShell, cmd: "NPM INSTALL lodash", remember: { version: 1, remember: [{ id: ps1, tool: PowerShell, command: "npm install lodash" }] }, o: allow, r: remember-ps1 }
