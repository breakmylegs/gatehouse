# D-055, licence policy (offline): a dependency the project does not use yet has its licence read from this computer.
# One outside the allowed list (MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense by default) goes to a
# person as licence-not-allowed, which Extreme approval never approves. One that cannot be read is said on D-053's card
# for a new package, and asks as licence-unknown on its own for a name the owner approved.
- { t: Bash, cmd: "npm install gpl-thing", cwd: "${WS}/fx/lic1", files: [{ path: "${WS}/fx/lic1/node_modules/gpl-thing/package.json", content: "{\"license\":\"GPL-3.0\"}" }], o: escalate, r: licence-not-allowed, note: "GPL-3.0, from node_modules" }
- { t: Bash, cmd: "npm install mit-thing", cwd: "${WS}/fx/lic2", files: [{ path: "${WS}/fx/lic2/node_modules/mit-thing/package.json", content: "{\"license\":\"MIT\"}" }], o: escalate, r: dependency-new, note: "MIT is allowed: only D-053's question" }
- { t: Bash, cmd: "npm install dual-thing", cwd: "${WS}/fx/lic3", files: [{ path: "${WS}/fx/lic3/node_modules/dual-thing/package.json", content: "{\"license\":\"(MIT OR GPL-3.0)\"}" }], o: escalate, r: dependency-new, note: "a choice that includes MIT is allowed" }
- { t: Bash, cmd: "npm install both-thing", cwd: "${WS}/fx/lic4", files: [{ path: "${WS}/fx/lic4/node_modules/both-thing/package.json", content: "{\"license\":\"MIT AND AGPL-3.0\"}" }], o: escalate, r: licence-not-allowed, note: "both must be allowed" }
- { t: Bash, cmd: "npm install mystery-thing", cwd: "${WS}/fx/lic5", o: escalate, r: dependency-new, note: "not on this computer: D-053 asks, and the card says its licence cannot be read (D-055)" }
- { t: Bash, cmd: "npm install private-thing", cwd: "${WS}/fx/lic6", files: [{ path: "${WS}/fx/lic6/node_modules/private-thing/package.json", content: "{\"license\":\"SEE LICENSE IN LICENSE\"}" }], o: escalate, r: dependency-new, note: "not an SPDX licence; the card says its licence cannot be read (D-055)" }
- { t: Bash, cmd: "dotnet add package Acme.Copyleft", cwd: "${WS}/fx/lic7", files: [{ path: "${ROOT}/.nuget/packages/acme.copyleft/1.0.0/acme.copyleft.nuspec", content: "<package><metadata><license type=\"expression\">LGPL-3.0-only</license></metadata></package>" }], o: escalate, r: licence-not-allowed, note: "NuGet, from the package folder" }
- { t: Bash, cmd: "npm install gpl-thing", cwd: "${WS}/fx/lic8", files: [{ path: "${WS}/fx/lic8/package-lock.json", content: "{\"packages\":{\"node_modules/gpl-thing\":{\"license\":\"GPL-3.0\"}}}" }, { path: "${WS}/fx/lic8/package.json", content: "{\"dependencies\":{\"gpl-thing\":\"^1\"}}" }], o: escalate, r: package-install, note: "the project already uses it: not asked about again" }
