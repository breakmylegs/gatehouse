# Secrets reached through every tool. The floor denies before any allow rule can apply.
# Negative controls at the end prove the floor is not denying everything.
- { t: Read, p: ".env", o: deny, r: secrets-files }
- { t: Read, p: ".env.local", o: deny, r: secrets-files }
- { t: Read, p: ".env.production", o: deny, r: secrets-files }
- { t: Read, p: "certs/server.pem", o: deny, r: secrets-files }
- { t: Read, p: "certs/server.key", o: deny, r: secrets-files }
- { t: Read, p: "keys/a.pfx", o: deny, r: secrets-files }
- { t: Read, p: "${WS}/.ssh/id_rsa", o: deny, r: secrets-files }
- { t: Read, p: "~/.ssh/id_ed25519", o: deny, r: secrets-files }
- { t: Read, p: "~/.ssh/id_rsa.pub", o: deny, r: secrets-files }
- { t: Read, p: ".aws/credentials", o: deny, r: secrets-files }
- { t: Read, p: ".azure/config", o: deny, r: secrets-files }
- { t: Read, p: "~/.claude/.credentials.json", o: deny, r: secrets-files }
- { t: Read, p: "id_ed25519", o: deny, r: secrets-files }
- { t: Read, p: "sub/dir/.env", o: deny, r: secrets-files }
- { t: Read, p: "${WS}/.ENV", o: deny, r: secrets-files }
- { t: Edit, p: ".env", o: deny, r: secrets-files }
- { t: Write, p: ".env", o: deny, r: secrets-files }
- { t: MultiEdit, p: ".env.local", o: deny, r: secrets-files }
- { t: NotebookEdit, p: "certs/server.pem", o: deny, r: secrets-files }
- { t: Grep, p: ".aws", o: deny, r: secrets-files }
- { t: Grep, p: ".ssh", o: deny, r: secrets-files }
- { t: Grep, g: "*.pem", o: deny, r: secrets-files }
- { t: Glob, g: "**/.env", o: deny, r: secrets-files }
- { t: Glob, g: "**/*.key", o: deny, r: secrets-files }
- { t: Glob, g: "**/id_rsa*", o: deny, r: secrets-files }
- { t: Glob, g: ".aws/**", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat .env", o: deny, r: secrets-files }
- { t: Bash, cmd: "type .env", o: deny, r: secrets-files }
- { t: Bash, cmd: "head -1 .env", o: deny, r: secrets-files }
- { t: Bash, cmd: "grep x .env", o: deny, r: secrets-files }
- { t: Bash, cmd: "cp .env x", o: deny, r: secrets-files }
- { t: Bash, cmd: "less < .env", o: deny, r: secrets-files }
- { t: Bash, cmd: "source .env", o: deny, r: secrets-files }
- { t: Bash, cmd: ". .env", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat ./.env", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat ../ws/.env", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat certs/server.pem", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat ~/.ssh/id_rsa", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat $HOME/.ssh/id_rsa", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat \"$HOME/.aws/credentials\"", o: deny, r: secrets-files }
- { t: Bash, cmd: "base64 .env", o: deny, r: secrets-files }
- { t: Bash, cmd: "for f in .env; do cat $f; done", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat .env.local", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat .ENV", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat .env.", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat '.env::$DATA'", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat \".env \"", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat .en?", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat .e*", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat .[e]nv", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat link/.env", o: deny, r: secrets-files }
- { t: Bash, cmd: "scp .env host:", o: deny, r: secrets-files }
- { t: Bash, cmd: "tar czf x.tgz .env", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat .aws/credentials", o: deny, r: secrets-files }
- { t: Bash, cmd: "ls .ssh", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat ${WS}/.azure/x", o: deny, r: secrets-files }
- { t: Bash, cmd: "cat ${ENV8}", o: deny, r: secrets-files, needs: env8, note: "the 8.3 short alias of .env resolves to the real name" }
- { t: Bash, cmd: "git add .env", o: deny, r: secrets-files }
- { t: Read, p: "src/a.env.ts", o: allow, r: read-workspace }
- { t: Read, p: "docs/.environment", o: allow, r: read-workspace }
- { t: Read, p: "keys.txt", o: allow, r: read-workspace }
- { t: Read, p: "package.json", o: allow, r: read-workspace }
- { t: Grep, p: "src", o: allow, r: read-workspace }
- { t: Grep, o: allow, r: read-workspace }
- { t: Glob, g: "src/**/*.ts", o: allow, r: read-workspace }
- { t: Glob, g: "**/*.md", o: allow, r: read-workspace }
- { t: Bash, cmd: "cat environment.txt", o: escalate, r: no-rule }
- { t: Bash, cmd: "cat src/envelope.ts", o: escalate, r: no-rule }
