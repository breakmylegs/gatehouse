# D-064, install-script default deny: an install that would run install scripts (a package's preinstall, install or
# postinstall, the project's own prepare on a bare install) goes to a person as install-scripts, showing each script;
# Extreme approval never approves it. With --ignore-scripts, or when nothing has a script, it is as before.
- { t: Bash, cmd: "npm install evil-pkg", cwd: "${WS}/fx/is1", files: [{ path: "${WS}/fx/is1/package-lock.json", content: "{\"packages\":{\"node_modules/evil-pkg\":{\"hasInstallScript\":true}}}" }, { path: "${WS}/fx/is1/package.json", content: "{\"dependencies\":{\"evil-pkg\":\"^1\"}}" }, { path: "${WS}/fx/is1/node_modules/evil-pkg/package.json", content: "{\"scripts\":{\"postinstall\":\"node steal.js\"}}" }], o: escalate, r: install-scripts, note: "a postinstall script, shown" }
- { t: Bash, cmd: "npm install --ignore-scripts evil-pkg", cwd: "${WS}/fx/is2", files: [{ path: "${WS}/fx/is2/package-lock.json", content: "{\"packages\":{\"node_modules/evil-pkg\":{\"hasInstallScript\":true}}}" }, { path: "${WS}/fx/is2/package.json", content: "{\"dependencies\":{\"evil-pkg\":\"^1\"}}" }, { path: "${WS}/fx/is2/node_modules/evil-pkg/package.json", content: "{\"scripts\":{\"postinstall\":\"node steal.js\"}}" }], o: escalate, r: package-install, note: "without scripts: only the usual install question" }
- { t: Bash, cmd: "npm ci", cwd: "${WS}/fx/is3", files: [{ path: "${WS}/fx/is3/package-lock.json", content: "{\"packages\":{\"node_modules/esbuild\":{\"hasInstallScript\":true}}}" }, { path: "${WS}/fx/is3/package.json", content: "{\"dependencies\":{\"esbuild\":\"^0.25\"}}" }], o: escalate, r: install-scripts, note: "a clean install, the lockfile names a script" }
- { t: Bash, cmd: "npm install", cwd: "${WS}/fx/is4", files: [{ path: "${WS}/fx/is4/package.json", content: "{\"scripts\":{\"prepare\":\"node hooks.js\"}}" }], o: escalate, r: install-scripts, note: "the project's own prepare runs on a bare install" }
- { t: Bash, cmd: "npm install lodash", cwd: "${WS}/fx/is5", files: [{ path: "${WS}/fx/is5/package-lock.json", content: "{\"packages\":{\"node_modules/lodash\":{}}}" }, { path: "${WS}/fx/is5/package.json", content: "{\"dependencies\":{\"lodash\":\"^4\"}}" }], o: escalate, r: package-install, note: "no script anywhere: as before" }
- { t: Bash, cmd: "yarn", cwd: "${WS}/fx/is6", files: [{ path: "${WS}/fx/is6/package.json", content: "{\"scripts\":{\"postinstall\":\"patch-package\"}}" }], o: escalate, r: install-scripts, note: "yarn on its own installs" }
